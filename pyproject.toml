[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jagadish-unified-retrieval-router"
version = "0.1.0"
description = "Data-agent retrieval router: one question, SQL and/or docs, governance at routing time."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.hatch.build.targets.wheel]
packages = ["router"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B"]
ignore = ["E741", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
